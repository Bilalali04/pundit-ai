<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pundit AI</title>
<script>
  // Set the theme attribute synchronously, before first paint, so there's no flash of the
  // wrong theme while the rest of the page loads. Defaults to dark (per project preference)
  // when nothing is stored yet.
  (function () {
    const stored = localStorage.getItem("pundit-ai-theme");
    document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
  })();
</script>
<style>
  :root[data-theme="dark"] {
    --bg: #0a1420;
    --header-bg-start: #06231a;
    --header-bg-end: #123a24;
    --header-text: #f5efe0;
    --header-subtitle: #c9d6cc;
    --header-border: #d4af37;
    --messages-bg: #0a1420;
    --pitch-stripe: rgba(255, 255, 255, 0.012);
    --bubble-user-bg-start: #1f7a3d;
    --bubble-user-bg-end: #2d9c52;
    --bubble-user-text: #ffffff;
    --bubble-agent-bg: #12233a;
    --bubble-agent-text: #e6ecf2;
    --bubble-agent-border: #24406b;
    --bubble-agent-accent: #d4af37;
    --bubble-pending-text: #8a97ab;
    --bubble-error-bg: #3a1a1a;
    --bubble-error-text: #ff9d9d;
    --bubble-error-border: #5c2626;
    --input-bar-bg: #0d1c2e;
    --input-bar-border: #1c3350;
    --input-bg: #142438;
    --input-text: #f2f2f5;
    --input-border: #26436a;
    --input-focus-border: #d4af37;
    --input-placeholder: #6f7f95;
    --button-bg-start: #1f7a3d;
    --button-bg-end: #2d9c52;
    --button-text: #ffffff;
    --button-disabled-bg: #22344a;
    --button-disabled-text: #6f7f95;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    --scrollbar-thumb: #24406b;
    --brand-icon-bg: #1f7a3d;
    --brand-icon-ring: #d4af37;
  }

  :root[data-theme="light"] {
    --bg: #f3f7f2;
    --header-bg-start: #0a3d24;
    --header-bg-end: #1f7a3d;
    --header-text: #ffffff;
    --header-subtitle: #dff2e4;
    --header-border: #d4af37;
    --messages-bg: #f3f7f2;
    --pitch-stripe: rgba(31, 122, 61, 0.065);
    --bubble-user-bg-start: #2d9c52;
    --bubble-user-bg-end: #1f7a3d;
    --bubble-user-text: #ffffff;
    --bubble-agent-bg: #ffffff;
    --bubble-agent-text: #142418;
    --bubble-agent-border: #dbe6de;
    --bubble-agent-accent: #c9a227;
    --bubble-pending-text: #7c8a80;
    --bubble-error-bg: #fee2e2;
    --bubble-error-text: #991b1b;
    --bubble-error-border: #fca5a5;
    --input-bar-bg: #ffffff;
    --input-bar-border: #e1e8e2;
    --input-bg: #ffffff;
    --input-text: #142418;
    --input-border: #cfe0d3;
    --input-focus-border: #1f7a3d;
    --input-placeholder: #93a396;
    --button-bg-start: #2d9c52;
    --button-bg-end: #1f7a3d;
    --button-text: #ffffff;
    --button-disabled-bg: #b9c9bd;
    --button-disabled-text: #f0f4f1;
    --shadow: 0 2px 8px rgba(20, 60, 35, 0.12);
    --scrollbar-thumb: #cfe0d3;
    --brand-icon-bg: #1f7a3d;
    --brand-icon-ring: #d4af37;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background-color 0.2s ease;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background-image:
      radial-gradient(160px circle at 10% 0%, rgba(255, 255, 255, 0.10), transparent 60%),
      radial-gradient(200px circle at 90% 0%, rgba(255, 255, 255, 0.08), transparent 60%),
      linear-gradient(135deg, var(--header-bg-start), var(--header-bg-end));
    color: var(--header-text);
    border-bottom: 2px solid var(--header-border);
    box-shadow: var(--shadow);
    z-index: 1;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--brand-icon-bg);
    border: 2px solid var(--brand-icon-ring);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  header .title {
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }

  header .subtitle {
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--header-subtitle);
    font-weight: 500;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #debug-toggle {
    padding: 7px 14px;
    border-radius: 14px;
    border: 1px solid rgba(212, 175, 55, 0.4);
    background: rgba(212, 175, 55, 0.1);
    color: var(--header-text);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  #debug-toggle:hover {
    background: rgba(212, 175, 55, 0.2);
  }

  #debug-toggle.active {
    background: var(--brand-icon-bg);
    border-color: var(--brand-icon-ring);
    color: #ffffff;
  }

  #theme-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(212, 175, 55, 0.4);
    background: rgba(212, 175, 55, 0.1);
    color: var(--header-text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }

  #theme-toggle:hover {
    background: rgba(212, 175, 55, 0.2);
    transform: scale(1.05);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background-color: var(--messages-bg);
    background-image: repeating-linear-gradient(
      90deg,
      transparent 0,
      var(--pitch-stripe) 70px,
      transparent 140px
    );
    transition: background-color 0.2s ease;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }

  #messages::-webkit-scrollbar {
    width: 8px;
  }
  #messages::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 8px;
  }

  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: var(--bubble-pending-text);
    font-size: 14.5px;
    transition: color 0.2s ease;
  }

  .msg {
    max-width: 70%;
    padding: 11px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: var(--shadow);
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .msg.user {
    align-self: flex-end;
    background-image: linear-gradient(135deg, var(--bubble-user-bg-start), var(--bubble-user-bg-end));
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }

  .msg.agent {
    align-self: flex-start;
    background: var(--bubble-agent-bg);
    color: var(--bubble-agent-text);
    border: 1px solid var(--bubble-agent-border);
    border-left: 3px solid var(--bubble-agent-accent);
    border-bottom-left-radius: 4px;
  }

  .msg.pending {
    align-self: flex-start;
    background: var(--bubble-agent-bg);
    border: 1px solid var(--bubble-agent-border);
    border-left: 3px solid var(--bubble-agent-accent);
    color: var(--bubble-pending-text);
    font-style: italic;
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: center;
    background: var(--bubble-error-bg);
    color: var(--bubble-error-text);
    border: 1px solid var(--bubble-error-border);
  }

  /* Trace elements are always in the DOM once a response has tool calls, but only shown
     when debug mode is on - toggling debug mode reveals/hides every trace already on the
     page, not just ones from messages sent after the toggle. */
  .trace-details {
    display: none;
    margin-top: 10px;
  }

  body.debug-mode .trace-details {
    display: block;
  }

  .trace-details summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--bubble-agent-accent);
    user-select: none;
  }

  .trace-entry {
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 8px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 12px;
  }

  .trace-call {
    color: var(--bubble-agent-accent);
    word-break: break-word;
  }

  .trace-result-label {
    margin-top: 6px;
    opacity: 0.65;
  }

  .trace-result {
    margin: 4px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: var(--input-bar-bg);
    border-top: 1px solid var(--input-bar-border);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  #input-bar input {
    flex: 1;
    padding: 11px 16px;
    border: 1px solid var(--input-border);
    border-radius: 22px;
    font-size: 14.5px;
    outline: none;
    background: var(--input-bg);
    color: var(--input-text);
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.15s ease;
  }

  #input-bar input::placeholder {
    color: var(--input-placeholder);
  }

  #input-bar input:focus {
    border-color: var(--input-focus-border);
  }

  #input-bar button {
    padding: 11px 22px;
    border: none;
    border-radius: 22px;
    background-image: linear-gradient(135deg, var(--button-bg-start), var(--button-bg-end));
    color: var(--button-text);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease, opacity 0.15s ease;
  }

  #input-bar button:hover:not(:disabled) {
    opacity: 0.9;
  }

  #input-bar button:disabled {
    background-image: none;
    background-color: var(--button-disabled-bg);
    color: var(--button-disabled-text);
    cursor: not-allowed;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-icon">⚽</span>
    <div class="brand-text">
      <span class="title">Pundit AI</span>
      <span class="subtitle">Your AI Football Analyst</span>
    </div>
  </div>
  <div class="header-actions">
    <button id="debug-toggle" title="Toggle debug mode" aria-pressed="false">🐞 Debug</button>
    <button id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"></button>
  </div>
</header>
<div id="messages">
  <div id="empty-state">⚽ Ask me about a player's performance or get a match prediction!</div>
</div>
<div id="input-bar">
  <input id="input" type="text" placeholder="Ask about a player's match performance..." autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
  // Kept in a plain JS variable, not exposed to the user - null until the first response
  // gives us one, then reused on every subsequent request so the backend continues the
  // same Gemini chat session (server-side conversation memory, per src/web/app.py).
  let sessionId = null;

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const themeToggleBtn = document.getElementById("theme-toggle");
  const debugToggleBtn = document.getElementById("debug-toggle");

  // Builds the collapsible tool-call trace shown under an agent response - text content is
  // set via textContent throughout (never innerHTML), since tool args/results are structured
  // data from the backend, not markup meant to be rendered.
  function buildTraceElement(trace) {
    const details = document.createElement("details");
    details.className = "trace-details";

    const summary = document.createElement("summary");
    summary.textContent = `🔧 Tool calls (${trace.length})`;
    details.appendChild(summary);

    trace.forEach((call) => {
      const entry = document.createElement("div");
      entry.className = "trace-entry";

      const callLine = document.createElement("div");
      callLine.className = "trace-call";
      callLine.textContent = `${call.tool}(${JSON.stringify(call.args)})`;
      entry.appendChild(callLine);

      const resultLabel = document.createElement("div");
      resultLabel.className = "trace-result-label";
      resultLabel.textContent = "→ result:";
      entry.appendChild(resultLabel);

      const resultBody = document.createElement("pre");
      resultBody.className = "trace-result";
      resultBody.textContent = JSON.stringify(call.result, null, 2);
      entry.appendChild(resultBody);

      details.appendChild(entry);
    });

    return details;
  }

  function addMessage(text, cssClass, trace) {
    const emptyState = document.getElementById("empty-state");
    if (emptyState) emptyState.remove();

    const div = document.createElement("div");
    div.className = "msg " + cssClass;

    const textEl = document.createElement("div");
    textEl.className = "msg-text";
    textEl.textContent = text;
    div.appendChild(textEl);

    if (trace && trace.length > 0) {
      div.appendChild(buildTraceElement(trace));
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;

    const pending = addMessage("Thinking...", "pending");

    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!resp.ok) {
        throw new Error("Server returned " + resp.status);
      }

      const data = await resp.json();
      sessionId = data.session_id;
      pending.remove();
      addMessage(data.response, "agent", data.debug_trace);
    } catch (err) {
      pending.remove();
      addMessage("Something went wrong: " + err.message, "error");
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // Theme toggle: reflects the *current* theme as an icon (sun shown in dark mode, meaning
  // "switch to light"; moon shown in light mode, meaning "switch to dark"), persisted to
  // localStorage so it survives a reload (read synchronously in <head>, before first paint).
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  }

  function updateToggleIcon() {
    themeToggleBtn.textContent = currentTheme() === "dark" ? "☀️" : "🌙";
  }

  themeToggleBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("pundit-ai-theme", next);
    updateToggleIcon();
  });

  updateToggleIcon();

  // Debug mode: purely a CSS toggle (body.debug-mode) rather than a per-message flag, so
  // switching it on reveals the trace on every agent message already on screen, not just
  // ones sent after the toggle - each trace is always built and attached in addMessage(),
  // just hidden by default via CSS until debug mode is active.
  debugToggleBtn.addEventListener("click", () => {
    const active = document.body.classList.toggle("debug-mode");
    debugToggleBtn.classList.toggle("active", active);
    debugToggleBtn.setAttribute("aria-pressed", String(active));
  });
</script>
</body>
</html>
