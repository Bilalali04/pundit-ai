<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pundit AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: #1a1a2e;
    color: #fff;
    font-weight: 600;
    font-size: 16px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: #fff;
    color: #1a1a2e;
    border: 1px solid #e0e0e6;
    border-bottom-left-radius: 4px;
  }
  .msg.pending {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e0e0e6;
    color: #999;
    font-style: italic;
  }
  .msg.error {
    align-self: center;
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
  }
  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: #fff;
    border-top: 1px solid #e0e0e6;
  }
  #input-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d0d0d6;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  #input-bar input:focus {
    border-color: #2563eb;
  }
  #input-bar button {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #input-bar button:disabled {
    background: #a0a0b0;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<header>Pundit AI - football analyst</header>
<div id="messages"></div>
<div id="input-bar">
  <input id="input" type="text" placeholder="Ask about a player's match performance..." autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
  // Kept in a plain JS variable, not exposed to the user - null until the first response
  // gives us one, then reused on every subsequent request so the backend continues the
  // same Gemini chat session (server-side conversation memory, per src/web/app.py).
  let sessionId = null;

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function addMessage(text, cssClass) {
    const div = document.createElement("div");
    div.className = "msg " + cssClass;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;

    const pending = addMessage("Thinking...", "pending");

    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!resp.ok) {
        throw new Error("Server returned " + resp.status);
      }

      const data = await resp.json();
      sessionId = data.session_id;
      pending.remove();
      addMessage(data.response, "agent");
    } catch (err) {
      pending.remove();
      addMessage("Something went wrong: " + err.message, "error");
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
